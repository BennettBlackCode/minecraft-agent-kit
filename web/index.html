<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Plays Minecraft</title>
<style>
  :root {
    --bg: #0e1012; --panel: #16191c; --line: #262a2f; --text: #e6e8ea; --muted: #8a9199;
    --accent: #d97757; --ok: #5fb37a; --err: #e05d5d; --run: #e0b45d;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, system-ui, sans-serif; }
  body { display: flex; overflow: hidden; }
  #stage { position: relative; flex: 1; min-width: 0; }
  #stage iframe { width: 100%; height: 100%; border: 0; display: block; }
  .hud { position: absolute; left: 14px; top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .hud button { background: rgba(14,16,18,.78); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; backdrop-filter: blur(6px); }
  .hud button.on { border-color: var(--accent); color: var(--accent); }
  .now { position: absolute; left: 14px; bottom: 14px; right: 14px; max-width: 640px; background: rgba(14,16,18,.82); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(6px); }
  .now .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .now .act { font-family: var(--mono); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  aside { width: 360px; flex: none; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header h1 span { color: var(--accent); }
  .goal { margin-top: 6px; color: var(--muted); }
  .goal b { color: var(--text); font-weight: 500; }
  section { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  section h2 { margin: 0 0 8px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .bars { display: grid; grid-template-columns: 52px 1fr 34px; gap: 6px 8px; align-items: center; }
  .bar { height: 8px; background: #22262a; border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; transition: width .3s; }
  .facts { margin-top: 10px; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-family: var(--mono); font-size: 12px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; }
  .inv { display: flex; flex-wrap: wrap; gap: 5px; }
  .inv span { background: #1e2226; border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px; font-family: var(--mono); font-size: 11.5px; }
  .inv span b { color: var(--accent); font-weight: 600; }
  .grow { flex: 1; overflow-y: auto; }
  .log { list-style: none; margin: 0; padding: 0; }
  .log li { padding: 7px 0; border-bottom: 1px dashed var(--line); font-family: var(--mono); font-size: 11.5px; }
  .log li:last-child { border-bottom: 0; }
  .log .head { display: flex; gap: 8px; align-items: baseline; }
  .log .t { color: var(--muted); }
  .log .a { font-weight: 600; }
  .log .r { color: var(--muted); margin-top: 2px; word-break: break-word; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; transform: translateY(-1px); }
  .s-ok { background: var(--ok); } .s-error { background: var(--err); } .s-running { background: var(--run); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .chat div { font-family: var(--mono); font-size: 11.5px; padding: 2px 0; word-break: break-word; }
  .chat .t { color: var(--muted); margin-right: 6px; }
  .empty { color: var(--muted); font-style: italic; }
  .offline { color: var(--err); }
  /* ?stream=1 (OBS browser source): no buttons, bigger text for viewers */
  body.stream .hud { display: none; }
  body.stream { font-size: 15px; }
  body.stream aside { width: 400px; }
  @media (max-width: 800px) {
    body { flex-direction: column; overflow: auto; }
    #stage { height: 60vh; flex: none; }
    aside { width: 100%; border-left: 0; overflow: visible; }
    .grow { overflow: visible; }
  }
</style>
</head>
<body>
<div id="stage">
  <iframe id="view" src="/view/" title="3D view"></iframe>
  <div class="hud">
    <button id="follow" class="on">Follow cam</button>
    <button id="free" title="Drag to look, wheel to zoom, WASD to fly, E/Q up/down, Shift = fast">Free cam</button>
    <button id="reset">Reset camera</button>
    <button id="pov">First-person</button>
    <button id="sound">Sound: off</button>
    <button id="music">Music: off</button>
  </div>
  <div class="now"><div class="label">Doing now <span id="cammode" style="float:right"></span></div><div class="act" id="now">—</div></div>
</div>
<aside>
  <header>
    <h1><span id="who">Agent</span> plays Minecraft</h1>
    <div class="goal">Goal: <b id="goal">—</b></div>
    <div class="goal">Autopilot: <b id="auto">—</b></div>
  </header>
  <section>
    <h2>Vitals</h2>
    <div class="bars">
      <span>Health</span><div class="bar"><i id="hp" style="background:#e05d5d"></i></div><span id="hpN"></span>
      <span>Food</span><div class="bar"><i id="food" style="background:#c9944a"></i></div><span id="foodN"></span>
    </div>
    <dl class="facts">
      <dt>pos</dt><dd id="pos"></dd>
      <dt>world</dt><dd id="world"></dd>
      <dt>holding</dt><dd id="holding"></dd>
      <dt>nearby</dt><dd id="nearby"></dd>
    </dl>
  </section>
  <section>
    <h2>Inventory</h2>
    <div class="inv" id="inv"></div>
  </section>
  <section class="grow">
    <h2>Action log</h2>
    <ul class="log" id="log"></ul>
  </section>
  <section style="max-height:22%;overflow-y:auto">
    <h2>Chat</h2>
    <div class="chat" id="chat"></div>
  </section>
</aside>
<script>
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const fmtArgs = (a) => Object.entries(a || {}).map(([k, v]) => `${k}=${typeof v === 'string' ? v : JSON.stringify(v)}`).join(' ')

// camera controls reach into the same-origin viewer iframe
const view = $('view')
let follow = true, pov = false
$('follow').onclick = () => { follow = !follow; view.contentWindow.__follow = follow; $('follow').classList.toggle('on', follow) }
$('reset').onclick = () => view.contentWindow.__resetCam?.()
let free = false
$('free').onclick = () => {
  free = !free
  view.contentWindow.__free = free
  $('free').classList.toggle('on', free); $('follow').classList.toggle('on', !free && follow)
  if (!free) view.contentWindow.__resetCam?.()
  view.focus(); view.contentWindow.focus() // so WASD reaches the 3D view
}
$('pov').onclick = () => { pov = !pov; $('pov').classList.toggle('on', pov); $('follow').disabled = $('reset').disabled = pov; view.src = pov ? '/view/?pov=1' : '/view/' }
view.onload = () => { view.contentWindow.__follow = follow }
// watchdog: if the 3D view stops getting camera updates (crashed tab, lost socket, WebGL context lost), reload it
setInterval(() => {
  if (pov) return
  let last = 0; try { last = view.contentWindow.__lastCam || 0 } catch {}
  if (last && Date.now() - last > 8000) view.src = view.src
}, 4000)

// ---- audio: game sounds pushed from the bot (via the viewer iframe's socket) + optional background music ----
let audio = null, master = null, soundOn = false, playing = 0
const buffers = new Map()
async function bufferFor(url) {
  if (!buffers.has(url)) buffers.set(url, fetch(url).then((r) => r.arrayBuffer()).then((b) => audio.decodeAudioData(b)).catch(() => null))
  return buffers.get(url)
}
window.__mcSound = async (s) => {
  if (!soundOn || !audio || playing > 16 || s.gain < 0.02) return
  const buf = await bufferFor(s.url)
  if (!buf) return
  const src = audio.createBufferSource(); src.buffer = buf; src.playbackRate.value = s.rate || 1
  const g = audio.createGain(); g.gain.value = Math.min(1, s.gain)
  src.connect(g).connect(master); playing++; src.onended = () => playing--
  src.start()
}
$('sound').onclick = async () => {
  if (!audio) { audio = new AudioContext(); master = audio.createGain(); master.gain.value = 0.8; master.connect(audio.destination) }
  soundOn = !soundOn
  soundOn ? await audio.resume() : await audio.suspend()
  $('sound').textContent = `Sound: ${soundOn ? 'on' : 'off'}`; $('sound').classList.toggle('on', soundOn)
}
const music = new Audio(); music.volume = 0.25
let musicOn = false
async function nextTrack() {
  try { const t = await fetch('/music-pick').then((r) => r.json()); music.src = t.url; await music.play() } catch { setTimeout(nextTrack, 5000) }
}
music.onended = () => { if (musicOn) setTimeout(nextTrack, 20000 + Math.random() * 40000) } // Minecraft-style gaps between tracks
// the agent's spoken think lines: play the newest, queue at most one more, duck the music while talking
const narrator = new Audio(); let narratorNext = null, lastVoice
function speak(url) {
  if (!soundOn) return
  if (!narrator.paused && !narrator.ended) { narratorNext = url; return }
  narrator.src = url; music.volume = 0.08; narrator.play().catch(narratorDone)
}
function narratorDone() {
  if (narratorNext) { const u = narratorNext; narratorNext = null; narrator.src = u; narrator.play().catch(narratorDone) } else music.volume = 0.25
}
narrator.onended = narratorDone
$('music').onclick = () => {
  musicOn = !musicOn
  musicOn ? nextTrack() : music.pause()
  $('music').textContent = `Music: ${musicOn ? 'on' : 'off'}`; $('music').classList.toggle('on', musicOn)
}

async function tick() {
  try {
    const [s, log] = await Promise.all([fetch('/api/state').then((r) => r.json()), fetch('/api/log').then((r) => r.json())])
    if (s.error) throw new Error(s.error)
    if (lastVoice === undefined) lastVoice = s.voice?.id ?? 0 // don't replay an old line when the page loads
    else if (s.voice && s.voice.id !== lastVoice) { lastVoice = s.voice.id; speak(s.voice.url) }
    if (s.name && $('who').textContent !== s.name) { $('who').textContent = s.name; document.title = `${s.name} Plays Minecraft` }
    $('goal').textContent = s.goal || 'none set'
    const ap = s.autopilot
    $('auto').textContent = !ap ? '—' : !ap.enabled ? 'off (agent driving)' : ap.last?.error ? `error: ${ap.last.error}` : ap.running ? `Clef chose ${ap.running}${ap.last?.conf != null ? ` (${Math.round(ap.last.conf * 100)}%, ${ap.last.ms}ms)` : ''}` : 'thinking…'
    $('cammode').textContent = s.camera ? `camera: ${s.camera}` : ''
    $('hp').style.width = (s.health / 20 * 100) + '%'; $('hpN').textContent = Math.round(s.health)
    $('food').style.width = (s.food / 20 * 100) + '%'; $('foodN').textContent = s.food
    $('pos').textContent = `${Math.round(s.pos.x)}, ${Math.round(s.pos.y)}, ${Math.round(s.pos.z)}`
    $('world').textContent = `${s.dimension.replace('minecraft:', '')} · ${s.isDay ? 'day' : 'night'}${s.raining ? ' · rain' : ''}`
    $('holding').textContent = s.holding || 'empty hand'
    const near = s.entities.filter((e) => e.type !== 'object' && e.type !== 'orb').slice(0, 4).map((e) => `${e.name} ${e.dist}m`)
    $('nearby').textContent = near.join(', ') || 'nothing'
    const inv = Object.entries(s.inventory)
    $('inv').innerHTML = inv.length ? inv.map(([n, c]) => `<span>${esc(n.replace(/_/g, ' '))} <b>${c}</b></span>`).join('') : '<span class="empty">empty</span>'
    $('chat').innerHTML = s.chat.length ? s.chat.slice().reverse().map((m) => `<div><span class="t">${m.t}</span>${esc(m.msg)}</div>`).join('') : '<div class="empty">quiet</div>'

    const running = log.filter((e) => e.status === 'running').pop()
    $('now').textContent = running ? `${running.action} ${fmtArgs(running.args)}` : 'thinking…'
    $('log').innerHTML = log.slice().reverse().map((e) => `<li>
      <div class="head"><span class="dot s-${e.status}"></span><span class="t">${e.t}</span><span class="a">${esc(e.action)}</span><span>${esc(fmtArgs(e.args))}</span></div>
      ${e.result ? `<div class="r">${esc(e.result)}</div>` : ''}</li>`).join('') || '<li class="empty">no actions yet</li>'
  } catch (e) {
    $('now').innerHTML = '<span class="offline">bot offline — reconnecting…</span>'
  }
}
tick(); setInterval(tick, 1000)

// stream mode for OBS: its browser allows audio without a click, so turn sound (and music) on automatically
const params = new URLSearchParams(location.search)
if (params.has('stream')) {
  document.body.classList.add('stream')
  $('sound').click()
  if (params.get('music') !== '0') $('music').click()
}
</script>
</body>
</html>
